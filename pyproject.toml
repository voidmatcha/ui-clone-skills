[project]
name = "ui-clone-skills"
version = "0.8.14"
description = "Clone any live website URL into React + Tailwind code — Claude Code and Codex plugin with extraction-first verification (real CSS, real animation params from JS bundles, AE/SSIM pixel diff)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "YONGJAE LEE" }]
requires-python = ">=3.11"
keywords = [
    "claude-code",
    "claude-code-plugin",
    "codex",
    "codex-plugin",
    "react",
    "nextjs",
    "tailwindcss",
    "ui-cloning",
    "url-to-react",
    "website-to-react",
    "gsap",
    "framer-motion",
    "webflow",
    "visual-regression",
    "ae-ssim",
    "agent-browser",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scikit-image==0.26.0",
    "Pillow==12.2.0",
    "numpy==2.4.4",
]

[project.urls]
Homepage = "https://github.com/voidmatcha/ui-clone-skills"
Repository = "https://github.com/voidmatcha/ui-clone-skills"
Issues = "https://github.com/voidmatcha/ui-clone-skills/issues"
Changelog = "https://github.com/voidmatcha/ui-clone-skills/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "execnet==2.1.2",
    "pytest==9.0.3",
    "ruff==0.9.10",
    "mypy==1.15.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
]
# Step D — AST-based JS bundle parsing, opt-in. Extractors prefer
# esprima when available and fall back to regex when not installed,
# so the core install stays lean. Install via: uv sync --group ast
ast = [
    "esprima==4.0.1",
]

# `hooks/shim.sh` points every installed copy's `uv run --project <root>`
# at ONE shared venv (~/.cache/ui-clone-skills/hook-venv) so a version bump
# doesn't rebuild a fresh venv inside each disposable plugin-cache copy.
# package = false keeps that shared venv from ever installing ui-clone-skills
# itself as an editable dependency: an editable install's .pth is keyed by
# whichever --project synced last, so with several copies (Claude cache,
# Codex cache, a version bump, the dev checkout) sharing the venv, one
# process could import another root's package mid-run, or crash with
# ModuleNotFoundError if a concurrent sync repoints the .pth first —
# reproduced empirically under concurrent --project alternation. With the
# project excluded here, shim.sh's PYTHONPATH="$project_root" is what makes
# `import ui_clone` resolve, deterministically, to the invoking root.
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ui_clone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Safety net for subprocess.run calls that shell out to scripts touching
# agent-browser: one un-timed call against a dead host would hang serial CI.
# timeout_method=thread terminates the whole process on expiry, even when
# blocked in a C-level subprocess wait. Keep this above the suite's explicit
# longest subprocess contracts (up to 300s) so it remains a final safety net,
# not the first timeout to fire. Opt-in integration tests are exempted with a
# per-item timeout(0) marker in tests/integration/conftest.py.
timeout = 300
timeout_method = "thread"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length enforced by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["^.venv/"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[[tool.mypy.overrides]]
module = "tifffile.*"
follow_imports = "skip"
