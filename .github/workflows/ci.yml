name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Local CI mirror
        # Pinned rather than left at `-n auto`. The suite carries ~700
        # subprocess timeouts in the 5-20s range and the parallel/serial
        # equivalence was proven on a 10-core machine; standard runners have 4
        # cores and slower I/O, so `auto` here is untested headroom rather than
        # a measured configuration. Raise it only with a green run to point at.
        env:
          UI_CLONE_PYTEST_WORKERS: "4"
        run: bash scripts/ci/ci-local.sh --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pre-push security gate
        run: bash scripts/ci/pre-push-security.sh

  socket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SocketDev/action@v1
        with:
          mode: firewall-free

  snyk:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Snyk Open Source scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
