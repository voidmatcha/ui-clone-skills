name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg imagemagick
          if ! command -v magick >/dev/null 2>&1; then
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'case "${1:-}" in' \
              '  compare|composite|convert|identify|mogrify|montage|stream)' \
              '    tool="$1"' \
              '    shift' \
              '    exec "$tool" "$@"' \
              '    ;;' \
              '  *) exec convert "$@" ;;' \
              'esac' | sudo tee /usr/local/bin/magick >/dev/null
            sudo chmod 0755 /usr/local/bin/magick
          fi
          command -v ffmpeg
          command -v magick

      - name: Local CI mirror
        # Pinned rather than left at `-n auto`. The suite carries ~700
        # subprocess timeouts in the 5-20s range and the parallel/serial
        # equivalence was proven on a 10-core machine; standard runners have 4
        # cores and slower I/O, so `auto` here is untested headroom rather than
        # a measured configuration. Raise it only with a green run to point at.
        env:
          UI_CLONE_PYTEST_WORKERS: "4"
        run: bash scripts/ci/ci-local.sh --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install node dependencies
        run: npm ci

      # Scoped to the replay-track file: it drives playwright-core directly,
      # while every other tests/integration/ module needs `agent-browser`,
      # which this runner does not install. The recorder launches
      # `channel: "chrome"`, which ubuntu-latest already provides.
      # Deliberately not in ci-local.sh: that script mirrors the `test` job and
      # stays npm-free so the local iteration loop does not pay for npm ci.
      - name: Replay-track integration suite
        run: >-
          UI_CLONE_INTEGRATION=1 uv run python -m pytest
          tests/integration/test_capture_replay_track_integration.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Pre-push security gate
        run: bash scripts/ci/pre-push-security.sh

  socket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: SocketDev/action@v1
        with:
          mode: firewall-free

  snyk:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Snyk Open Source scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
