<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Motion forensics</title>
<style>
  body { font: 13px ui-sans-serif, system-ui; margin: 0; width: 320px; padding: 16px; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 10px; font-size: 13px;
           text-align: left; border: 1px solid #ddd; background: #fff; border-radius: 4px;
           cursor: pointer; }
  button:hover { background: #f6f6f6; }
  .meta { color: #666; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Motion forensics — pick a job</h1>
<button data-job="decode">Decode  — analyse motion + build (no code)</button>
<button data-job="clone">Clone  — generate React + Tailwind</button>
<button data-job="verify">Verify  — score impl against ref</button>
<button data-job="extract">Extract  — raw JSON dump</button>
<div class="meta" id="status">Local MCP server: <span id="conn">checking…</span></div>
<script src="popup.js"></script>
</body>
</html>
