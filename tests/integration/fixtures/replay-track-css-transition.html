<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Replay Track CSS Transition</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: rgb(255, 255, 255);
      }
      .action-label {
        display: block;
        position: relative;
        width: 200px;
        height: 40px;
        color: black;
        background: rgb(255, 255, 255);
        opacity: 1;
        transform: translateY(0px);
        transition: opacity 500ms linear, transform 500ms linear;
      }
      body.scrolled .action-label {
        opacity: 0.4;
        transform: translateY(80px);
      }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="primary">
        <span class="action-label">State Of Our Health</span>
      </nav>
    </header>
    <script>
      addEventListener("scroll", () => {
        document.body.classList.toggle("scrolled", scrollY > 50);
      }, { passive: true });
    </script>
  </body>
</html>
