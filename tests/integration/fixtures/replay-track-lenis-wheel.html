<!doctype html>
<html class="lenis lenis-smooth">
  <head>
    <meta charset="utf-8">
    <title>Replay Track Lenis Wheel</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      .lenis-wheel-label {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 40px;
        background: rgb(255, 255, 255);
        opacity: 1;
        transform: translateY(0px);
      }
    </style>
  </head>
  <body data-lenis>
    <span class="lenis-wheel-label">Lenis wheel</span>
    <script>
      const label = document.querySelector(".lenis-wheel-label");
      const render = () => {
        const progress = Math.min(Math.max(window.scrollY / 200, 0), 1);
        label.style.opacity = String(1 - progress * 0.5);
        label.style.transform = `translateY(${progress * 80}px)`;
      };
      window.__lenis = {
        scroll: 0,
        animatedScroll: 0,
        scrollTo(top) {
          const next = Math.max(0, Math.min(Number(top), document.documentElement.scrollHeight - innerHeight));
          this.scroll = next;
          this.animatedScroll = next;
          window.scrollTo({ top: next, left: 0, behavior: "instant" });
          render();
        },
      };
      window.addEventListener("wheel", (event) => {
        event.preventDefault();
        window.__lenis.scrollTo(window.scrollY + event.deltaY);
      }, { passive: false });
      window.addEventListener("scroll", render, { passive: true });
      render();
    </script>
  </body>
</html>
