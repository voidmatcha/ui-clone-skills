<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Replay Track ScrollSmoother Global</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      .transport-label {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 40px;
        background: rgb(255, 255, 255);
      }
    </style>
  </head>
  <body>
    <span class="transport-label">ScrollSmoother global</span>
    <script>
      const smoother = {
        scrollTo(top) {
          window.scrollTo({ top: Number(top), left: 0, behavior: "instant" });
        },
        scrollTop() {
          return window.scrollY;
        },
      };
      window.gsap = {
        core: {
          globals() {
            return {
              ScrollSmoother: {
                get() {
                  return smoother;
                },
              },
            };
          },
        },
      };
    </script>
  </body>
</html>
