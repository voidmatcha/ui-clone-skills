<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Replay Track Virtual rAF Spring</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      .virtual-label {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 40px;
        background: rgb(255, 255, 255);
        opacity: 1;
        transform: translateY(0px);
      }
    </style>
  </head>
  <body>
    <span class="virtual-label">Virtual rAF</span>
    <script>
      window.nativeScrollCount = 0;
      let startedAt = null;
      function render(now) {
        if (startedAt === null) startedAt = now;
        const progress = Math.min(Math.max((now - startedAt) / 640, 0), 1);
        const label = document.querySelector(".virtual-label");
        label.style.opacity = String(1 - progress * 0.5);
        label.style.transform = `translateY(${progress * 80}px)`;
        label.style.height = `${40 + window.nativeScrollCount + progress * 80}px`;
        if (progress < 1) {
          requestAnimationFrame(render);
        }
      }
      addEventListener("scroll", () => {
        window.nativeScrollCount += 1;
        startedAt = performance.now();
        requestAnimationFrame(render);
      }, { passive: true });
    </script>
  </body>
</html>
