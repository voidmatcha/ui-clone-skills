<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Replay Track Scroll Timeline</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      .scroll-label {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 40px;
        background: rgb(255, 255, 255);
        animation: move 1s linear both;
        animation-timeline: scroll(root);
        animation-range: 0 300px;
      }
      @keyframes move {
        from {
          opacity: 1;
          transform: translateY(0px);
        }
        to {
          opacity: 0.4;
          transform: translateY(80px);
        }
      }
    </style>
  </head>
  <body>
    <span class="scroll-label">Scroll timeline</span>
  </body>
</html>
