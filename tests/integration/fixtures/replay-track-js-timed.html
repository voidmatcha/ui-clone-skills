<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Replay Track JS Timed Mutation</title>
    <style>
      body {
        margin: 0;
        min-height: 2000px;
        background: white;
      }
      .js-label {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 200px;
        height: 40px;
        background: rgb(255, 255, 255);
        opacity: 1;
        transform: translateY(0px);
      }
    </style>
  </head>
  <body>
    <span class="js-label">JS timed</span>
    <script>
      addEventListener("scroll", () => {
        setTimeout(() => {
          const label = document.querySelector(".js-label");
          label.style.opacity = "0.4";
          label.style.transform = "translateY(80px)";
        }, 20);
      }, { passive: true });
    </script>
  </body>
</html>
