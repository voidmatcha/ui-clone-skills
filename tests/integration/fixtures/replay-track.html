<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replay track fixture</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 2400px;
      }

      #tracked-nav {
        position: sticky;
        top: 0;
        width: 100%;
        height: 80px;
        opacity: 1;
        background-color: rgb(255, 255, 255);
        clip-path: inset(0px 0px 0px 0px);
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <nav id="tracked-nav" role="navigation">Fixture navigation</nav>
    <script>
      (() => {
        const nav = document.querySelector("#tracked-nav");
        const update = () => {
          const progress = Math.min(Math.max(window.scrollY / 1000, 0), 1);
          nav.style.transform = `translateY(${-40 * progress}px)`;
          nav.style.height = `${80 - 20 * progress}px`;
          nav.style.opacity = String(1 - 0.2 * progress);
        };
        window.addEventListener("scroll", update, { passive: true });
        update();
      })();
    </script>
  </body>
</html>
